name: build-ios
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string

# GitHub 호스티드 macOS 러너를 쓴다(이 저장소가 public이면 Actions 분 자체가 무료다).
# 작업마다 새 VM이 뜨므로 self-hosted 때와 달리 러너 동시 처리 한도를 따로 신경 쓸 필요는 없다.
# (프로젝트별 중복 빌드 방지는 애플리케이션 레벨의 assertNoActiveBuild가 이미 막는다.)
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      BUILD_ID: ${{ inputs.build_id }}
      API_BASE: ${{ secrets.API_BASE }}
      RUNNER_SHARED_SECRET: ${{ secrets.RUNNER_SHARED_SECRET }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install fastlane
        working-directory: builder
        run: bundle install

      - name: Run build
        run: node builder/run-build.mjs

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/job" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/output" "$RUNNER_TEMP/build_number.txt"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
